<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberNet Syndicate</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050a11; --bg-panel: #0d1522; --border-dark: #1a2639; --text-main: #c4d4e6;
            --cyan: #00f0ff; --cyan-dim: rgba(0, 240, 255, 0.1); --blue: #2a8cff;
            --green: #00e700; --yellow: #ffcc00; --grey: #8a9ba8; --red: #ff2a2a;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg-main); color: var(--text-main); font-family: 'Rajdhani', sans-serif; margin: 0; padding: 0; padding-bottom: 80px; user-select: none; }
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; font-size: 18px; color: var(--cyan); border-bottom: 1px solid var(--border-dark); background: var(--bg-panel); }
        .header-title { font-weight: 700; text-align: center; line-height: 1.1; letter-spacing: 1px; }
        .resources-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 15px; }
        .res-card { background: var(--bg-panel); border: 1px solid var(--border-dark); border-radius: 8px; padding: 10px 2px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .res-name { font-size: 9px; font-weight: 700; letter-spacing: 1px; margin-bottom: 2px; }
        .res-val { font-size: 12px; font-weight: 600; color: #fff; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .missions-panel { background: var(--bg-panel); border: 1px solid var(--border-dark); border-radius: 12px; margin: 15px; padding: 15px; }
        .mission-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
        .mission-row { background: rgba(255,255,255,0.02); border: 1px solid #1a2639; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-upgrade { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 12px; border-radius: 6px; font-family: inherit; font-weight: 700; cursor: pointer; font-size: 12px; text-align: center; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: var(--bg-panel); padding: 10px 0; border-top: 1px solid var(--border-dark); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #556677; font-size: 10px; font-weight: 700; cursor: pointer; flex: 1; text-align: center; }
        .nav-item.active { color: var(--cyan); }
    </style>
</head>
<body>

    <div class="top-header">
        <i class="fas fa-bars"></i>
        <div class="header-title">CYBERNET<br>SYNDICATE</div>
        <i class="fas fa-user-circle"></i>
    </div>

    <div class="resources-grid">
        <div class="res-card"><i class="fas fa-hammer"></i><span class="res-name">METAL</span><span class="res-val" id="val-metal">0</span></div>
        <div class="res-card"><i class="fas fa-microchip"></i><span class="res-name">CHIPS</span><span class="res-val" id="val-chips">0</span></div>
        <div class="res-card"><i class="fas fa-battery-half"></i><span class="res-name">BATT</span><span class="res-val" id="val-battery">100%</span></div>
        <div class="res-card"><i class="fas fa-dollar-sign"></i><span class="res-name">GOLD</span><span class="res-val" id="val-gold">0</span></div>
        <div class="res-card" style="border-color:var(--red)"><i class="fas fa-project-diagram"></i><span class="res-name">PROXY</span><span class="res-val" id="val-proxies">0</span></div>
    </div>

    <div id="tab-home" class="tab-content active">
        <div class="missions-panel">
            <h4 style="color:var(--cyan)">HAKERA STATISTIKA</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div style="background:rgba(255,255,255,0.02); padding:10px; border-radius:8px;">⚔️ SPĒKS: <span id="home-stat-attack">10</span></div>
                <div style="background:rgba(255,255,255,0.02); padding:10px; border-radius:8px;">🛡️ AIZS: <span id="home-stat-defense">10</span></div>
            </div>
        </div>
    </div>

    <div id="tab-casino" class="tab-content">
        <div class="missions-panel"><h3>🎲 CYBER-CASINO</h3><p>Dice spēle darbojas. Veiksmi!</p></div>
    </div>

    <div id="tab-missions" class="tab-content">
        <div class="missions-panel">
            <h3><i class="fas fa-terminal"></i> OPERĀCIJAS</h3>
            <div id="missions-list"></div>
        </div>

        <div class="missions-panel" style="border: 1px solid var(--red);">
            <h3 style="color:var(--red)"><i class="fas fa-crosshairs"></i> KIBER-KARI (PvP)</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                <div><strong>IEGĀDĀTIES PROKSIJU</strong><br><small>300 Metāls | 100 Čipi</small></div>
                <button class="btn-upgrade" onclick="buyProxy()">PIRKT</button>
            </div>
            <button class="btn-upgrade" style="width:100%; border-color:var(--red); color:var(--red)" onclick="loadTargets()">MĒRĶU SARAKSTS</button>
            <div id="targets-list" class="mission-grid"></div>
            <div id="pvp-result-msg" style="margin-top:10px; text-align:center;"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('tab-home', this)"><i class="fas fa-home"></i><span>HOME</span></div>
        <div class="nav-item" onclick="switchTab('tab-casino', this)"><i class="fas fa-dice"></i><span>CASINO</span></div>
        <div class="nav-item" onclick="switchTab('tab-missions', this)"><i class="fas fa-terminal"></i><span>PVP</span></div>
    </div>

    <script>
        const API_URL = "https://cybernet-sindicate.loca.lt/api";
        const tgId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 123456789;

        async function buyProxy() {
            let res = await fetch(`${API_URL}/pvp/buy-proxy`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({tgId}) });
            let data = await res.json();
            alert(data.message || data.error);
            fetchPlayerData();
        }

        async function loadTargets() {
            const list = document.getElementById('targets-list');
            list.innerHTML = "Meklē tīklā...";
            let res = await fetch(`${API_URL}/pvp/targets/${tgId}`);
            let targets = await res.json();
            list.innerHTML = targets.map(t => `
                <div class="mission-row">
                    <div><strong>${t.name}</strong><br><small>Level: ${t.level}</small></div>
                    <button class="btn-upgrade" onclick="attackPlayer(${t.tgId})" style="border-color:var(--red)">UZBRUKT</button>
                </div>
            `).join('');
        }

        async function attackPlayer(targetId) {
            let res = await fetch(`${API_URL}/pvp/attack`, { 
                method: 'POST', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({ tgId, targetId }) 
            });
            let data = await res.json();
            document.getElementById('pvp-result-msg').innerText = data.message;
            fetchPlayerData();
        }

        async function fetchPlayerData() {
            let res = await fetch(`${API_URL}/player/${tgId}`);
            let p = await res.json();
            document.getElementById('val-metal').innerText = p.resources.metal;
            document.getElementById('val-chips').innerText = p.resources.silicon;
            document.getElementById('val-proxies').innerText = p.resources.proxies;
            document.getElementById('home-stat-attack').innerText = p.stats.attack;
            document.getElementById('home-stat-defense').innerText = p.stats.defense;
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }
        
        fetchPlayerData();
    </script>
</body>
</html>
