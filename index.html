<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberNet Syndicate</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050a11; --bg-panel: #0d1522; --border-dark: #1a2639; --text-main: #c4d4e6;
            --cyan: #00f0ff; --cyan-dim: rgba(0, 240, 255, 0.1); --blue: #2a8cff;
            --green: #00ff66; --yellow: #ffcc00; --grey: #a0b0c0; --red: #ff3366;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg-main); color: var(--text-main); font-family: 'Rajdhani', sans-serif; margin: 0; padding: 0; padding-bottom: 80px; user-select: none; }

        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; font-size: 18px; color: var(--cyan); border-bottom: 1px solid var(--border-dark); background: var(--bg-panel); }
        .header-title { font-weight: 700; text-align: center; line-height: 1.1; letter-spacing: 1px; }

        .resources-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px; }
        .res-card { background: var(--bg-panel); border: 1px solid var(--border-dark); border-radius: 8px; padding: 12px 5px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .res-card i { font-size: 20px; margin-bottom: 8px; }
        .res-name { font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
        .res-val { font-size: 13px; font-weight: 600; color: #fff; }
        .c-metal { border-color: var(--grey); color: var(--grey); }
        .c-chips { border-color: var(--blue); color: var(--blue); }
        .c-battery { border-color: var(--green); color: var(--green); }
        .c-gold { border-color: var(--yellow); color: var(--yellow); }

        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .map-section { margin: 0 15px 15px 15px; border: 1px solid var(--cyan); border-radius: 12px; background: linear-gradient(var(--cyan-dim) 1px, transparent 1px), linear-gradient(90deg, var(--cyan-dim) 1px, transparent 1px); background-size: 20px 20px; background-color: #070d18; overflow: hidden; }
        .map-header { display: flex; justify-content: space-between; padding: 10px 15px; background: rgba(0, 240, 255, 0.05); color: var(--cyan); font-weight: 600; border-bottom: 1px solid rgba(0, 240, 255, 0.2); }
        .map-content { height: 160px; display: flex; align-items: center; justify-content: center; color: rgba(0, 240, 255, 0.5); font-size: 14px; letter-spacing: 2px; }
        
        /* 💡 PIEVIENOTS: Misiju bloka dizains, saskaņots ar esošo tēmu */
        .missions-panel { background: var(--bg-panel); border: 1px solid var(--border-dark); border-radius: 12px; margin: 0 15px 15px 15px; padding: 15px; }
        .mission-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }

        .building-item { background: var(--bg-panel); border: 1px solid var(--border-dark); margin: 0 15px 10px 15px; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .building-locked { filter: grayscale(1) opacity(0.4); border-style: dashed; }
        .btn-upgrade { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 12px; border-radius: 6px; font-family: inherit; font-weight: 700; cursor: pointer; font-size: 12px; width: 100%; text-align: center; }
        .btn-upgrade:active { background: var(--cyan); color: #000; }
        
        .cost-tag { font-size: 11px; color: var(--grey); margin-top: 3px; display: block; }
        .prod-tag { font-size: 11px; color: var(--green); margin-top: 2px; display: block; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: var(--bg-panel); padding: 10px 0; border-top: 1px solid var(--border-dark); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #556677; font-size: 11px; font-weight: 700; cursor: pointer; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--cyan); }
    </style>
</head>
<body>

    <div class="top-header">
        <i class="fas fa-bars"></i>
        <div class="header-title">CYBERNET<br>SYNDICATE</div>
        <i class="fas fa-user-circle"></i>
    </div>

    <div class="resources-grid">
        <div class="res-card c-metal"><i class="fas fa-hammer"></i><span class="res-name">METAL</span><span class="res-val" id="val-metal">0</span></div>
        <div class="res-card c-chips"><i class="fas fa-microchip"></i><span class="res-name">CHIPS</span><span class="res-val" id="val-chips">0</span></div>
        <div class="res-card c-battery"><i class="fas fa-battery-half"></i><span class="res-name">BATTERY</span><span class="res-val" id="val-battery">100%</span></div>
        <div class="res-card c-gold"><i class="fas fa-dollar-sign"></i><span class="res-name">GOLD CHIPS</span><span class="res-val" id="val-gold">0</span></div>
    </div>

    <div id="tab-home" class="tab-content active">
        <div class="map-section">
            <div class="map-header"><span>Hacker Hideout</span><i class="fas fa-satellite-dish"></i></div>
            <div class="map-content" id="home-map-status"><i class="fas fa-network-wired" style="font-size: 40px; opacity: 0.3;"></i></div>
        </div>

        <div class="missions-panel">
            <h4 style="margin: 0; color: var(--cyan);"><i class="fas fa-terminal"></i> AKTĪVĀS OPERĀCIJAS</h4>
            <div class="mission-grid">
                <button class="btn-upgrade" onclick="runMission('easy')" style="font-size:10px;">EASY<br>+30 M<br><span style="font-size:8px; color:var(--grey);">-10 ⚡</span></button>
                <button class="btn-upgrade" onclick="runMission('medium')" style="font-size:10px; border-color:var(--blue); color:var(--blue);">MED<br>+25 C<br><span style="font-size:8px; color:var(--grey);">-25 ⚡</span></button>
                <button class="btn-upgrade" onclick="runMission('hard')" style="font-size:10px; border-color:var(--red); color:var(--red);">HARD<br>+80 M<br><span style="font-size:8px; color:var(--grey);">-50 ⚡</span></button>
            </div>
        </div>
    </div>

    <div id="tab-market" class="tab-content"><div class="building-item"><div style="text-align:center; width:100%;"><h3>🛒 MELNĀ BIRŽA</h3><p>Tirgus modulis būs pieejams drīzumā.</p></div></div></div>
    <div id="tab-casino" class="tab-content"><div class="building-item"><div style="text-align:center; width:100%;"><h3>🎲 CYBER-CASINO</h3><p>Crash un Sloti tiek konfigurēti.</p></div></div></div>

    <div id="tab-base" class="tab-content">
        <h3 style="color: var(--cyan); margin-left: 15px;"><i class="fas fa-server"></i> INFRASTRUKTŪRA</h3>
        <div id="buildings-list">Ielādē bāzes sistēmas...</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('tab-home', this)"><i class="fas fa-home"></i><span>HOME</span></div>
        <div class="nav-item" onclick="switchTab('tab-market', this)"><i class="fas fa-shopping-cart"></i><span>MARKET</span></div>
        <div class="nav-item" onclick="switchTab('tab-casino', this)"><i class="fas fa-dice"></i><span>CASINO</span></div>
        <div class="nav-item" onclick="switchTab('tab-base', this)"><i class="fas fa-server"></i><span>BASE</span></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        const API_URL = "https://cybernet-sindicate.loca.lt/api"; 
        const tgId = tg?.initDataUnsafe?.user?.id || 123456789;

        const bNames = {
            mainframe: "Komandu Centrs", mine: "Lūžņu Pārstrāde", server: "Serveru Ferma",
            generator: "Ģeneratoru Bloks", firewall: "Ugunsmūris", lab: "Kiber-Laboratorija",
            vault: "Šifrēta Datu Velve", botnet: "Botnet Centrs"
        };

        const bStats = {
            mainframe: { bMetal: 200, bChips: 50,  bEnergy: 0,   bProd: 0 },
            mine:      { bMetal: 100, bChips: 0,   bEnergy: 5,   bProd: 20 },
            server:    { bMetal: 150, bChips: 40,  bEnergy: 8,   bProd: 10 },
            generator: { bMetal: 120, bChips: 20,  bEnergy: 0,   bProd: 35 },
            firewall:  { bMetal: 180, bChips: 80,  bEnergy: 4,   bProd: 0 },
            lab:       { bMetal: 250, bChips: 150, bEnergy: 10,  bProd: 0 },
            vault:     { bMetal: 300, bChips: 200, bEnergy: 6,   bProd: 0 },
            botnet:    { bMetal: 500, bChips: 400, bEnergy: 15,  bProd: 0 }
        };

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        async function fetchPlayerData() {
            try {
                let res = await fetch(`${API_URL}/player/${tgId}`, { headers: {'Bypass-Tunnel-Reminder': 'true'} });
                let p = await res.json();
                updateUI(p);
            } catch (err) { console.log("Meklē serveri..."); }
        }

        function updateUI(p) {
            document.getElementById('val-metal').innerText = p.resources.metal;
            document.getElementById('val-chips').innerText = p.resources.silicon;
            document.getElementById('val-battery').innerText = p.resources.battery + "%";
            document.getElementById('val-gold').innerText = p.resources.gold;

            if (p.resources.battery === 0) {
                document.getElementById('home-map-status').innerHTML = `<span style="color:var(--red); font-weight:bold; text-align:center;"><i class="fas fa-exclamation-triangle"></i> ENERĢIJAS KRĪZE!<br>RAŽOŠANA APTURĒTA</span>`;
            } else {
                document.getElementById('home-map-status').innerHTML = `<i class="fas fa-network-wired" style="font-size: 40px; color:var(--cyan); text-shadow:0 0 10px var(--cyan);"></i>`;
            }

            let bHtml = "";
            for (const [key, bData] of Object.entries(bStats)) {
                let currentLvl = parseInt(p.buildings[key]) || 0;
                let nextLvl = currentLvl + 1;

                const costM = Math.floor(bData.bMetal * Math.pow(1.5, nextLvl - 1));
                const costC = Math.floor(bData.bChips * Math.pow(1.5, nextLvl - 1));
                let costText = `Izmaksas (Lvl ${nextLvl}): 🛠️ ${costM}`;
                if (costC > 0) costText += ` | 💾 ${costC}`;

                let prodText = "";
                if (currentLvl > 0) {
                    if (key === 'generator') {
                        let prod = Math.floor(bData.bProd * Math.pow(1.3, currentLvl - 1));
                        prodText = `⚡ Ražo ietilpību: +${prod}`;
                    } else if (bData.bProd > 0) {
                        let prod = Math.floor(bData.bProd * Math.pow(1.3, currentLvl - 1));
                        let cons = Math.floor(bData.bEnergy * Math.pow(1.2, currentLvl - 1));
                        let n = key === 'mine' ? 'Metālu' : 'Čipus';
                        prodText = `Ražo: +${prod} ${n}/h | Patērē: -${cons} ⚡`;
                    } else if (bData.bEnergy > 0) {
                        let cons = Math.floor(bData.bEnergy * Math.pow(1.2, currentLvl - 1));
                        prodText = `Patērē: -${cons} ⚡`;
                    } else {
                        prodText = `Status: Tiešsaistē`;
                    }
                } else {
                    prodText = `Nav uzbūvēts`;
                }

                let isLocked = false;
                let lockText = "";
                let mainLvl = parseInt(p.buildings.mainframe) || 1;
                
                if (key === 'lab' && mainLvl < 5) { isLocked = true; lockText = "🔒 Vajag Mainframe Lvl 5"; }
                if (key === 'vault' && mainLvl < 10) { isLocked = true; lockText = "🔒 Vajag Mainframe Lvl 10"; }
                if (key === 'botnet' && mainLvl < 15) { isLocked = true; lockText = "🔒 Vajag Mainframe Lvl 15"; }

                if (isLocked) {
                    bHtml += `
                        <div class="building-item building-locked">
                            <div><div style="font-weight:700; color:#fff;">${bNames[key]}</div><span class="cost-tag">${lockText}</span></div>
                        </div>`;
                } else {
                    bHtml += `
                        <div class="building-item">
                            <div>
                                <div style="font-weight:700; color:#fff;">${bNames[key]} <span style="color:var(--cyan)">Lvl ${currentLvl}</span></div>
                                <span class="prod-tag">${prodText}</span>
                                <span class="cost-tag">${costText}</span>
                            </div>
                            <div style="width: 80px;">
                                <button class="btn-upgrade" onclick="upgradeBuilding('${key}')">UZLABOT</button>
                            </div>
                        </div>`;
                }
            }
            document.getElementById('buildings-list').innerHTML = bHtml;
        }

        async function upgradeBuilding(bKey) {
            try {
                let res = await fetch(`${API_URL}/upgrade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' },
                    body: JSON.stringify({ tgId: tgId, bKey: bKey })
                });
                let data = await res.json();
                if (data.error) { alert(data.error); } else { updateUI(data); }
            } catch (err) { alert("Sistēmas kļūda būvniecības laikā."); }
        }

        // 💡 PIEVIENOTS: Funkcija misiju palaišanai un komunikācijai ar serveri
        async function runMission(diff) {
            try {
                let res = await fetch(`${API_URL}/mission`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' },
                    body: JSON.stringify({ tgId: tgId, difficulty: diff })
                });
                let data = await res.json();
                if (data.error) { alert(data.error); } else { updateUI(data); }
            } catch (err) { alert("Sistēmas kļūda misijas laikā."); }
        }

        setInterval(fetchPlayerData, 4000);
        fetchPlayerData();
    </script>
</body>
</html>
